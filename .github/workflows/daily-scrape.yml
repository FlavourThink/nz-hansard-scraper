name: Daily Hansard scrape

on:
  schedule:
    # 18:00 UTC ≈ 06:00 NZST — after most sitting days finish
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      recent_days:
        description: "How many recent calendar days to check for new sittings"
        required: false
        default: "14"
      backfill_sittings:
        description: "How many historical sitting days to collect this run (walks toward Feb 2003)"
        required: false
        default: "15"
      force:
        description: "Force re-scrape existing days (true/false)"
        required: false
        default: "false"

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Scrape recent + backfill 15 sittings
        env:
          HANSARD_USER_AGENT: ${{ secrets.HANSARD_USER_AGENT }}
        run: |
          RECENT="${{ github.event.inputs.recent_days }}"
          RECENT="${RECENT:-14}"
          FILL="${{ github.event.inputs.backfill_sittings }}"
          FILL="${FILL:-15}"
          FORCE_FLAG=""
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            FORCE_FLAG="--force"
          fi
          python scripts/scrape_hansard.py --recent "$RECENT" --backfill-sittings "$FILL" --delay 2.5 $FORCE_FLAG

      - name: Commit data if changed
        run: |
          git config user.name "hansard-bot"
          git config user.email "hansard-bot@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "chore: update Hansard data $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
